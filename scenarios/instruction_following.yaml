# instruction_following: explicit, machine-checkable output constraints.
# JSON answers must be bare JSON (is-json parses the whole output) and satisfy a
# JSON Schema; values and format rules are checked by small JavaScript assertions.

- description: if_json_incident_schema
  metadata:
    category: instruction_following
    purpose: Extract an incident report into JSON that satisfies a strict schema (exact keys, enum, integer and boolean types) with correct values.
    num_predict: 400
  vars:
    messages:
      - role: user
        content: |
          Convert this incident report into JSON.

          Report: At 14:05 UTC the payments API and the checkout service began returning
          errors after a TLS certificate expired. Incident INC-4471 was opened with severity
          high. Customers could not complete purchases for 38 minutes. The search service
          was unaffected.

          Return only a JSON object with exactly these fields:
          - incident_id (string)
          - severity (one of: low, medium, high, critical)
          - affected_services (array of lowercase service names, only the affected ones)
          - customer_impact (boolean)
          - duration_minutes (integer)
          Do not add any other fields.
  assert:
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required: [incident_id, severity, affected_services, customer_impact, duration_minutes]
        properties:
          incident_id: {type: string, pattern: '^INC-\d+$'}
          severity: {enum: [low, medium, high, critical]}
          affected_services: {type: array, minItems: 2, maxItems: 2, items: {type: string, pattern: '^[^A-Z]+$'}}
          customer_impact: {type: boolean}
          duration_minutes: {type: integer}
    - type: javascript
      value: |
        const d = JSON.parse(output);
        return d.incident_id === 'INC-4471' && d.severity === 'high'
          && d.customer_impact === true && d.duration_minutes === 38;
    - type: not-icontains
      value: search

- description: if_json_forbidden_fields
  metadata:
    category: instruction_following
    purpose: Produce a JSON record while honoring a prohibition; contact details present in the source must be left out of every field.
    num_predict: 400
  vars:
    messages:
      - role: user
        content: |
          Create a JSON staff-directory entry for the person described below.

          Text: Dr. Amara Okafor joined the Platform team on 11 March 2024 as a Staff
          Engineer. Her email is amara.okafor@example.org and her mobile number is
          +1 555 0142. She works from the Lisbon office.

          Rules:
          - Required keys: name, title, team, office, start_date (formatted YYYY-MM-DD).
          - Do NOT include contact details: no email address and no phone number, under any key.
          - No keys other than the five required ones.
          Return only the JSON object.
  assert:
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required: [name, title, team, office, start_date]
        properties:
          name: {type: string}
          title: {type: string}
          team: {type: string}
          office: {type: string}
          start_date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    - type: javascript
      value: |
        const d = JSON.parse(output);
        return d.title.toLowerCase() === 'staff engineer' && d.team.toLowerCase() === 'platform'
          && d.office.toLowerCase() === 'lisbon' && d.start_date === '2024-03-11';
    - type: not-contains-any
      value: ['@', '555', '0142']

- description: if_json_filter_sort
  metadata:
    category: instruction_following
    purpose: Filter and sort data into an exact JSON array. Comparing major versions numerically is the trap, since "23" counts as >= 3.
    num_predict: 400
  vars:
    messages:
      - role: user
        content: |
          Package versions:
          requests 2.32.3
          numpy 1.26.4
          flask 3.0.3
          attrs 23.2.0
          pytest 8.2.1
          six 1.16.0

          Return a JSON array containing only the packages whose major version (the
          number before the first dot) is 3 or greater, sorted alphabetically by name.
          Each element must be an object {"name": ..., "version": ...} with the version
          as a string. Return only the JSON array.
  assert:
    - type: is-json
      value:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, version]
          properties: {name: {type: string}, version: {type: string}}
    - type: javascript
      value: >-
        JSON.parse(output).map(p => `${p.name}@${p.version}`).join(',')
        === 'attrs@23.2.0,flask@3.0.3,pytest@8.2.1'

- description: if_bullets_multi_constraint
  metadata:
    category: instruction_following
    purpose: Satisfy four simultaneous rules - line count, bullet syntax, a per-line word limit, and a forbidden word.
    num_predict: 400
  vars:
    messages:
      - role: user
        content: |
          Give advice on backing up a personal laptop.

          Format rules (all mandatory):
          1. Exactly 3 lines, each a bullet that starts with "- ".
          2. Each bullet has at most 12 words, not counting the dash.
          3. Do not use the word "cloud" anywhere.
          4. No title, introduction, or closing sentence.
  assert:
    - type: javascript
      value: |
        const lines = output.trim().split('\n').filter(l => l.trim());
        if (lines.length !== 3) return {pass: false, score: 0, reason: `${lines.length} lines, expected 3`};
        const bad = lines.filter(l => !/^- \S/.test(l) || l.trim().split(/\s+/).length > 13);
        return bad.length ? {pass: false, score: 0, reason: `bad bullet: ${bad[0]}`} : true;
    - type: not-icontains
      value: cloud

- description: if_status_line_exact
  metadata:
    category: instruction_following
    purpose: Apply stated rules to data and return one line in a precisely specified key=value format.
    num_predict: 400
  vars:
    messages:
      - role: user
        content: |
          Service health data:
          - api: healthy, p95 latency 120 ms
          - worker: degraded, p95 latency 900 ms
          - db: healthy, p95 latency 15 ms
          - cache: healthy, p95 latency 3 ms

          Rules: overall STATUS is DOWN if any service is down, otherwise DEGRADED if any
          service is degraded, otherwise OK. SLOWEST is the service with the highest p95
          latency.

          Respond with exactly one line in this format and nothing else:
          STATUS=<status>; SERVICES=<number of services>; SLOWEST=<service name>
  assert:
    - type: equals
      value: "STATUS=DEGRADED; SERVICES=4; SLOWEST=worker"

- description: if_csv_sorted_exact
  metadata:
    category: instruction_following
    purpose: Emit exact CSV with a prescribed header, normalized item names, and a two-key sort order (quantity descending, then name for ties).
    num_predict: 400
  vars:
    messages:
      - role: user
        content: |
          Stockroom note: we counted 12 blue mugs, 30 pencils, 7 staplers and 30 notebooks.

          Return CSV with the header line `item,quantity` and one row per item, sorted by
          quantity descending; break ties alphabetically by item name. Use these item
          names exactly: mug, pencil, stapler, notebook. No spaces, no code fences, and
          no other text.
  assert:
    - type: equals
      value: |-
        item,quantity
        notebook,30
        pencil,30
        mug,12
        stapler,7
