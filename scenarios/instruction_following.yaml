category: instruction_following
description: >
  Explicit, machine-checkable output constraints. JSON answers are parsed and
  validated against a JSON Schema; format rules are checked by the `constraints`
  grader. A code fence around otherwise valid JSON is tolerated.

defaults:
  options: {num_predict: 400}

cases:
  - id: if_json_incident_schema
    purpose: >
      Extract an incident report into JSON that satisfies a strict schema (exact keys,
      enum, integer and boolean types) with correct values.
    messages:
      - role: user
        content: |
          Convert this incident report into JSON.

          Report: At 14:05 UTC the payments API and the checkout service began returning
          errors after a TLS certificate expired. Incident INC-4471 was opened with severity
          high. Customers could not complete purchases for 38 minutes. The search service
          was unaffected.

          Return only a JSON object with exactly these fields:
          - incident_id (string)
          - severity (one of: low, medium, high, critical)
          - affected_services (array of lowercase service names, only the affected ones)
          - customer_impact (boolean)
          - duration_minutes (integer)
          Do not add any other fields.
    grader:
      type: json
      schema:
        type: object
        additionalProperties: false
        required: [incident_id, severity, affected_services, customer_impact, duration_minutes]
        properties:
          incident_id: {type: string, pattern: '^INC-\d+$'}
          severity: {enum: [low, medium, high, critical]}
          affected_services:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: string, pattern: '^[^A-Z]+$'}
          customer_impact: {type: boolean}
          duration_minutes: {type: integer}
      expect:
        incident_id: INC-4471
        severity: high
        customer_impact: true
        duration_minutes: 38
      forbidden_text: ['search']

  - id: if_json_forbidden_fields
    purpose: >
      Produce a JSON record while honoring a prohibition: contact details present in
      the source must be left out of every field.
    messages:
      - role: user
        content: |
          Create a JSON staff-directory entry for the person described below.

          Text: Dr. Amara Okafor joined the Platform team on 11 March 2024 as a Staff
          Engineer. Her email is amara.okafor@example.org and her mobile number is
          +1 555 0142. She works from the Lisbon office.

          Rules:
          - Required keys: name, title, team, office, start_date (formatted YYYY-MM-DD).
          - Do NOT include contact details: no email address and no phone number, under any key.
          - No keys other than the five required ones.
          Return only the JSON object.
    grader:
      type: json
      schema:
        type: object
        additionalProperties: false
        required: [name, title, team, office, start_date]
        properties:
          name: {type: string}
          title: {type: string}
          team: {type: string}
          office: {type: string}
          start_date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
      expect:
        title: Staff Engineer
        team: Platform
        office: Lisbon
        start_date: "2024-03-11"
      forbidden_text: ['@', '555', '0142']

  - id: if_json_filter_sort
    purpose: >
      Filter and sort data into an exact JSON array. Comparing major versions
      numerically is the trap: "23" counts as >= 3.
    messages:
      - role: user
        content: |
          Package versions:
          requests 2.32.3
          numpy 1.26.4
          flask 3.0.3
          attrs 23.2.0
          pytest 8.2.1
          six 1.16.0

          Return a JSON array containing only the packages whose major version (the
          number before the first dot) is 3 or greater, sorted alphabetically by name.
          Each element must be an object {"name": ..., "version": ...} with the version
          as a string. Return only the JSON array.
    grader:
      type: json
      schema:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, version]
          properties:
            name: {type: string}
            version: {type: string}
      expect:
        $:
          - {name: attrs, version: 23.2.0}
          - {name: flask, version: 3.0.3}
          - {name: pytest, version: 8.2.1}

  - id: if_bullets_multi_constraint
    purpose: >
      Satisfy four simultaneous format and content rules: line count, bullet syntax,
      a per-line word limit, and a forbidden word.
    messages:
      - role: user
        content: |
          Give advice on backing up a personal laptop.

          Format rules (all mandatory):
          1. Exactly 3 lines, each a bullet that starts with "- ".
          2. Each bullet has at most 12 words, not counting the dash.
          3. Do not use the word "cloud" anywhere.
          4. No title, introduction, or closing sentence.
    grader:
      type: constraints
      checks:
        - line_count: {eq: 3}
        - each_line_matches: '^- \S'
        - each_line_max_words: 13      # 12 words plus the "-" token
        - not_contains: 'cloud'

  - id: if_status_line_exact
    purpose: >
      Apply stated rules to data and return one line in a precisely specified
      key=value format.
    messages:
      - role: user
        content: |
          Service health data:
          - api: healthy, p95 latency 120 ms
          - worker: degraded, p95 latency 900 ms
          - db: healthy, p95 latency 15 ms
          - cache: healthy, p95 latency 3 ms

          Rules: overall STATUS is DOWN if any service is down, otherwise DEGRADED if any
          service is degraded, otherwise OK. SLOWEST is the service with the highest p95
          latency.

          Respond with exactly one line in this format and nothing else:
          STATUS=<status>; SERVICES=<number of services>; SLOWEST=<service name>
    grader:
      type: exact
      case_sensitive: true
      expected: "STATUS=DEGRADED; SERVICES=4; SLOWEST=worker"

  - id: if_csv_sorted_exact
    purpose: >
      Emit exact CSV with a prescribed header, normalized item names, and a two-key
      sort order (quantity descending, then name for ties).
    messages:
      - role: user
        content: |
          Stockroom note: we counted 12 blue mugs, 30 pencils, 7 staplers and 30 notebooks.

          Return CSV with the header line `item,quantity` and one row per item, sorted by
          quantity descending; break ties alphabetically by item name. Use these item
          names exactly: mug, pencil, stapler, notebook. No spaces, no code fences, and
          no other text.
    grader:
      type: exact
      expected: |-
        item,quantity
        notebook,30
        pencil,30
        mug,12
        stapler,7
