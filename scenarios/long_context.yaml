# long_context: find one precise fact in a long supplied conversation or document.
# Histories are generated deterministically by helpers/long_context.py from the
# generator and params below (meeting_notes is adapted from experiment 001). The
# expected answer is random per seed, so it can't have been memorized; the assertion
# regenerates it. Token counts are approximate for Qwen-family tokenizers (~120 per
# meeting note, ~45 per inventory row); the actual count is in each result.
# The 20k-26k cases need num_ctx 32768 (the default); at smaller EVAL_NUM_CTX values
# they are reported INVALID, never failed.

- description: lc_notes_early
  metadata: {category: long_context, num_predict: 64, purpose: Recall a code stated near the beginning of a 40-note (~5k token) meeting log.}
  vars:
    generator: meeting_notes
    params: {notes: 40, position: early}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}

- description: lc_notes_middle
  metadata: {category: long_context, num_predict: 64, purpose: Recall a code stated in the middle of a 40-note (~5k token) meeting log.}
  vars:
    generator: meeting_notes
    params: {notes: 40, position: middle}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}

- description: lc_notes_late
  metadata: {category: long_context, num_predict: 64, purpose: Recall a code stated near the end of a 40-note (~5k token) meeting log.}
  vars:
    generator: meeting_notes
    params: {notes: 40, position: late}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}

- description: lc_notes_similar_distractors
  metadata: {category: long_context, num_predict: 64, purpose: 'Pick the right code when six look-alike facts (same sentence pattern and code format, similarly named projects such as "Aurora Mobile") are spread through the log.'}
  vars:
    generator: meeting_notes
    params: {notes: 40, position: middle, similar_distractors: 6}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}

- description: lc_inventory_ip
  metadata: {category: long_context, num_predict: 64, purpose: Look up one row of a 100-row (~5k token) table where near-miss hostnames (db-prod-07, db-stage-17) sit beside the target db-prod-17.}
  vars:
    generator: server_inventory
    params: {rows: 100, position: middle}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}

- description: lc_long_notes_middle_11k
  metadata: {category: long_context, num_predict: 64, purpose: The experiment-001 setting (90 notes, ~11k tokens) with the fact mid-way.}
  vars:
    generator: meeting_notes
    params: {notes: 90, position: middle}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}

- description: lc_long_notes_distractors_11k
  metadata: {category: long_context, num_predict: 64, purpose: About 11k tokens with the fact late in the log and six look-alike facts.}
  vars:
    generator: meeting_notes
    params: {notes: 90, position: late, similar_distractors: 6}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}

- description: lc_long_notes_early_26k
  metadata: {category: long_context, num_predict: 64, purpose: Fact near the start of a ~26k-token log with four look-alike facts.}
  vars:
    generator: meeting_notes
    params: {notes: 210, position: early, similar_distractors: 4}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}

- description: lc_long_inventory_ip_20k
  metadata: {category: long_context, num_predict: 64, purpose: Row lookup in a 450-row (~20k token) table with near-miss hostnames.}
  vars:
    generator: server_inventory
    params: {rows: 450, position: late}
    messages: file://helpers/long_context.py
  assert:
    - {type: python, value: file://helpers/assertions.py:long_context_answer}
