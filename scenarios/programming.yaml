    category: programming
    purpose: Identify the line containing an off-by-one bug (index 0 is never checked).
    num_predict: 256
  vars:
    messages:
      - role: user
        content: |
          This function has exactly one bug. Which line number contains it? Reply with only the line number.

          ```
          1  def last_index(items, target):
          2      """Return the index of the last occurrence of target in items, or -1."""
          3      for i in range(len(items) - 1, 0, -1):
          4          if items[i] == target:
          5              return i
          6      return -1
          ```
