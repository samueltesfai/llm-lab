category: programming
description: >
  Small software-engineering tasks with objectively known answers. Expected program
  outputs were verified by running the programs. Code-writing tasks are graded by
  running hidden tests on the model's function in the sandbox (llm_eval/sandbox.py):
  static import/builtin policy, isolated interpreter, resource limits, timeout, and
  no network when available. Code is never executed in the evaluating process.

defaults:
  options: {num_predict: 256}

cases:
  - id: pg_trace_mutable_default
    purpose: Predict output involving Python's shared mutable default argument.
    messages:
      - role: user
        content: |
          What exactly does this Python program print? Reply with only the output.

          ```python
          def add(item, bucket=[]):
              bucket.append(item)
              return len(bucket)

          print(add("a"), add("b"), add("c", []), add("d"))
          ```
    grader: {type: exact, expected: "1 2 1 3"}

  - id: pg_trace_sort_key
    purpose: Trace a sort with a composite key (descending value, then name) plus slicing.
    messages:
      - role: user
        content: |
          What exactly does this Python program print? Reply with only the output lines.

          ```python
          scores = {"bo": 3, "al": 3, "cy": 1, "di": 2}
          order = sorted(scores, key=lambda k: (-scores[k], k))
          print(",".join(order))
          print(sum(scores[k] for k in order[1:3]))
          ```
    grader:
      type: exact
      expected: |-
        al,bo,di,cy
        5

  - id: pg_bug_locate_line
    purpose: Identify the line containing an off-by-one bug (index 0 is never checked).
    messages:
      - role: user
        content: |
          This function has exactly one bug. Which line number contains it? Reply with only the line number.

          ```
          1  def last_index(items, target):
          2      """Return the index of the last occurrence of target in items, or -1."""
          3      for i in range(len(items) - 1, 0, -1):
          4          if items[i] == target:
          5              return i
          6      return -1
          ```
    grader: {type: number, expected: 3}

  - id: pg_bug_fix_chunk
    purpose: Fix a function that drops the final partial chunk; verified by hidden tests.
    options: {num_predict: 768}
    messages:
      - role: user
        content: |
          This function is supposed to split a list into consecutive chunks of length
          `size`, where the last chunk may be shorter. It has a bug. Return the corrected
          function, with the same name and signature, in a single ```python code block.
          Use only the Python standard library.

          ```python
          def chunk(seq, size):
              return [seq[i:i + size] for i in range(0, len(seq) - size, size)]
          ```
    grader:
      type: python_function
      function: chunk
      tests:
        - {args: [[1, 2, 3, 4, 5], 2], expected: [[1, 2], [3, 4], [5]]}
        - {args: [[1, 2], 2], expected: [[1, 2]]}
        - {args: [[], 3], expected: []}
        - {args: [[1, 2, 3], 5], expected: [[1, 2, 3]]}
        - {args: [[1, 2, 3, 4, 5, 6], 3], expected: [[1, 2, 3], [4, 5, 6]]}

  - id: pg_select_implementation
    purpose: >
      Choose the only implementation meeting all stated constraints (order-preserving,
      O(n)) among plausible alternatives.
    messages:
      - role: user
        content: |
          Which implementation removes duplicates from a list, keeps the first occurrence
          of each item in its original order, and runs in O(n) expected time for hashable
          items? Answer with only the letter.

          A)
          ```python
          def dedupe(xs):
              return list(set(xs))
          ```
          B)
          ```python
          def dedupe(xs):
              out = []
              for x in xs:
                  if x not in out:
                      out.append(x)
              return out
          ```
          C)
          ```python
          def dedupe(xs):
              seen = set()
              out = []
              for x in xs:
                  if x not in seen:
                      seen.add(x)
                      out.append(x)
              return out
          ```
          D)
          ```python
          def dedupe(xs):
              return sorted(set(xs), key=xs.index)
          ```
    grader: {type: choice, expected: C}

  - id: pg_write_merge_intervals
    purpose: Implement interval merging, including touching, nested and unsorted inputs.
    options: {num_predict: 2048}
    cutoff: fail      # a correct answer needs ~200 tokens; exhausting 2048 is a failure
    messages:
      - role: user
        content: |
          Write a Python function `merge_intervals(intervals)`.

          - `intervals` is a list of [start, end] pairs of integers with start <= end, in any order.
          - Return a new list of merged, non-overlapping [start, end] pairs sorted by start.
          - Intervals that overlap or touch (for example [1, 3] and [3, 5]) must be merged.

          Use only the Python standard library and no I/O. Reply with a single ```python
          code block containing the function.
    grader:
      type: python_function
      function: merge_intervals
      tests:
        - {args: [[]], expected: []}
        - {args: [[[1, 3], [2, 6], [8, 10], [15, 18]]], expected: [[1, 6], [8, 10], [15, 18]]}
        - {args: [[[1, 4], [4, 5]]], expected: [[1, 5]]}
        - {args: [[[5, 6], [1, 2]]], expected: [[1, 2], [5, 6]]}
        - {args: [[[1, 10], [2, 3], [4, 8]]], expected: [[1, 10]]}
        - {args: [[[2, 2]]], expected: [[2, 2]]}

  - id: pg_write_parse_duration
    purpose: Implement a small parser with strict input validation (valid inputs and ValueError cases).
    options: {num_predict: 2048}
    cutoff: fail      # a correct answer needs ~250 tokens; exhausting 2048 is a failure
    messages:
      - role: user
        content: |
          Write a Python function `parse_duration(text)` that converts strings such as
          "1h30m", "45s", "2h5s" and "10m" into a total number of seconds (an int).

          - The units are h, m and s. Each unit appears at most once, in the order h, m, s,
            and each is preceded by a positive integer.
          - Raise ValueError for anything else, including an empty string, "5x", "m10",
            "1m1h", "1h1h" and "1.5h".

          Use only the Python standard library and no I/O. Reply with a single ```python
          code block containing the function.
    grader:
      type: python_function
      function: parse_duration
      tests:
        - {args: ["1h30m"], expected: 5400}
        - {args: ["45s"], expected: 45}
        - {args: ["2h5s"], expected: 7205}
        - {args: ["10m"], expected: 600}
        - {args: ["1h1m1s"], expected: 3661}
        - {args: [""], raises: ValueError}
        - {args: ["5x"], raises: ValueError}
        - {args: ["m10"], raises: ValueError}
        - {args: ["1m1h"], raises: ValueError}
        - {args: ["1h1h"], raises: ValueError}
        - {args: ["1.5h"], raises: ValueError}
