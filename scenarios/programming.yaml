# programming: small software-engineering tasks with objectively known answers.
# Expected program outputs were verified by running the programs. Code-writing tasks
# run hidden tests on the model's function in llm_eval/sandbox.py (static policy,
# isolated interpreter, resource limits, timeout, no network when available); the
# code never runs in promptfoo's own Python process.

- description: pg_trace_mutable_default
  metadata:
    category: programming
    purpose: Predict output involving Python's shared mutable default argument.
    num_predict: 256
  vars:
    messages:
      - role: user
        content: |
          What exactly does this Python program print? Reply with only the output.

          ```python
          def add(item, bucket=[]):
              bucket.append(item)
              return len(bucket)

          print(add("a"), add("b"), add("c", []), add("d"))
          ```
  assert:
    - {type: python, value: file://helpers/assertions.py:exact, config: {expected: "1 2 1 3"}}

- description: pg_trace_sort_key
  metadata:
    category: programming
    purpose: Trace a sort with a composite key (descending value, then name) plus slicing.
    num_predict: 256
  vars:
    messages:
      - role: user
        content: |
          What exactly does this Python program print? Reply with only the output lines.

          ```python
          scores = {"bo": 3, "al": 3, "cy": 1, "di": 2}
          order = sorted(scores, key=lambda k: (-scores[k], k))
          print(",".join(order))
          print(sum(scores[k] for k in order[1:3]))
          ```
  assert:
    - type: python
      value: file://helpers/assertions.py:exact
      config:
        expected: |-
          al,bo,di,cy
          5

- description: pg_bug_locate_line
